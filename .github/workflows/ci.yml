# ruff, mypy --strict, the test suite, the end-to-end drivers and the markdown links.
# One job each, so a failure names which of them it was.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # so a run can be forced without pushing anything

# Read-only: nothing here comments, pushes or publishes.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant, so stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests tools
      # Runs even when Lint failed, so one push reports both.
      - name: Format
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if ! python -m ruff format --check src tests tools; then
            echo "::error::Run 'python -m ruff format src tests tools' and commit the result."
            exit 1
          fi

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Strict mode is configured in pyproject.toml, over `src` only: the tests deliberately poke at
      # private attributes and pass deliberately-wrong values.
      - run: python -m mypy src

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One red cell must not hide the others: which platforms fail is the useful information.
      fail-fast: false
      matrix:
        # 3.11 is the floor `requires-python` states, so it is the one that can break by accident.
        # Windows is here because that is where this is developed, Linux because that is where a bot
        # actually runs, and the suite opens real sockets and starts real threads, so the two are not
        # interchangeable.
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  e2e:
    name: end-to-end drivers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Each driver runs a real bot against a fake server and checks what the commands
      # accomplished, not what was sent. Each exits non-zero and names the check that failed.
      - name: Run every e2e driver
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          status=0
          for driver in tools/fakeservers/e2e_*.py; do
            echo "::group::$driver"
            python "$driver" || status=1
            echo "::endgroup::"
          done
          exit $status

  docs:
    name: markdown links and counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The link checker is stdlib only; the count checker asks pytest how many tests there are.
      - run: python tools/check_links.py
      - run: python -m pip install -e ".[dev]"
      # Only the published documents exist here: PARITY.md and TODO.md are gitignored, and the
      # checker reports on whatever it finds rather than insisting they are present.
      - name: Counts
        if: ${{ !cancelled() }}
        run: python tools/check_counts.py
