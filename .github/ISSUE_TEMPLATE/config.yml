# A blank issue stays available on purpose: not everything worth reporting fits a form, and a form
# that refuses the awkward cases loses them.
blank_issues_enabled: true
contact_links:
  - name: Security report
    url: https://github.com/SirReaDy/BigBrotherBot/security/advisories/new
    about: >
      Anything that lets somebody reach a command above their level, reach RCON, or read a password.
      Privately, so the detail stays out of sight until there is a fix to go with it. See SECURITY.md.
  - name: Documentation
    url: https://sirready.github.io/BigBrotherBot/
    about: Configuration, the plugins and their settings, the supported titles, and migrating from B3 1.x.
