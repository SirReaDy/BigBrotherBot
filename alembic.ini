# Alembic config for manual/dev use (`alembic upgrade head`).
# The b3 runtime drives migrations programmatically via b3.storage.migrations, which sets the
# database URL from your b3 config; this file is a convenience for running Alembic by hand.
[alembic]
script_location = src/b3/storage/migrations
prepend_sys_path = src
# Overridden at runtime; set here only for manual CLI use.
sqlalchemy.url = sqlite:///b3.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
