[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "b3ng"
version = "2.0.0a0"
description = "Big Brother Bot (B3) 2.0 — modern, typed, async game-server admin bot"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639: an SPDX expression plus the file itself, so a built wheel carries the licence text
# rather than only a claim about it. Needs setuptools>=77, which the build-system pins.
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "B3 project" }]
keywords = ["game-server", "admin-bot", "rcon", "call-of-duty", "battlefield", "urban-terror"]

# What the package index and GitHub read to place this. The Python versions are the ones CI actually
# runs, so this list and the test matrix are the same claim made twice; if one moves, move both.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: First Person Shooters",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]


# Core runtime dependencies. Kept minimal for the v1 (CoD4 + admin) scope.
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    # Round-trip YAML: `b3 plugin install` edits the operator's hand-written config in place, so it
    # must preserve comments and key order (PyYAML cannot).
    "ruamel.yaml>=0.18",
    # IANA time-zone database for bot.time_zone / schedules. Windows ships no zoneinfo data at all,
    # and many slim Linux containers omit it too.
    "tzdata>=2024.1",
    # Reads the IP-to-country database this package ships. Not an extra: shipping a database the
    # default install cannot open would be 8 MB of dead weight and a `geolocation` plugin that
    # explains, on every install, that it needs something else. Pure Python fallback included, so
    # nothing here needs a compiler.
    "maxminddb>=2.6",
]

# There is no PyPI page to carry these, so they are what a packaged copy points back at.
[project.urls]
Homepage = "https://github.com/SirReaDy/BigBrotherBot"
Repository = "https://github.com/SirReaDy/BigBrotherBot"
Documentation = "https://sirready.github.io/BigBrotherBot/"
Issues = "https://github.com/SirReaDy/BigBrotherBot/issues"
Changelog = "https://github.com/SirReaDy/BigBrotherBot/releases"

[project.optional-dependencies]
# Web dashboard + REST/WebSocket API (v2 layer, not required for the core bot).
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pyjwt>=2.8"]
# MySQL / PostgreSQL backends (SQLite needs nothing extra).
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
# Tailing a hosted server's game log over sftp://. ftp/ftps/http need nothing extra (stdlib).
sftp = ["paramiko>=3.4"]
# Tab completion in bash/zsh/fish/tcsh/PowerShell — `b3 completion <shell>` prints what to add. An
# extra, not a dependency: completion is a convenience, and a bot that would not start without a
# completion library is a poor trade. `b3.cli` works unchanged when it is absent.
completion = ["argcomplete>=3.1,<4.0"]
# Test + dev tooling.
dev = [
    # Every tool here is capped, and for one reason: CI installs whatever is newest, so an upstream
    # release on a Tuesday can turn a green branch red and look exactly like our bug. A cap makes an
    # upgrade a commit somebody made, with any resulting diff in it. Raise them on purpose.
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    # A linter changes what it enforces between releases.
    "ruff>=0.15,<0.17",
    # And a type checker changes what it can infer, which is the same thing with a longer diff.
    "mypy>=1.9,<3.0",
    # The completion extra, here as well, so CI exercises both halves of it: the tests cover what
    # the shell is offered *and* what `b3 completion` says when the package is absent.
    "argcomplete>=3.1,<4.0",
    # Type stubs for the libraries the bot reads config and remote logs with. Without these,
    # `mypy --strict` cannot see into them and reports every call site as untyped.
    "types-PyYAML>=6.0",
    "types-paramiko>=3.4",
]
# Building the documentation site. An extra rather than a dev dependency: `pytest`, `ruff` and `mypy`
# are what you need to *change* this project, and the site is what you need to publish it — a
# contributor fixing a parser should not have to install a theme. The docs workflow installs this
# one; `ci.yml` installs `dev`.
#
# Capped for the same reason everything above is: a theme release changes what a page looks like, and
# `mkdocs build --strict` fails on things a new version starts warning about. Both are pure Python,
# so there is no Node anywhere in this project — which is also why the terminal demo on the home page
# is rendered by `tools/termsvg.py` rather than by `svg-term` or `agg`.
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]

[project.scripts]
b3 = "b3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The bundled IP-to-country database, so `geolocation` works on a fresh install with nothing to
# download. See `src/b3/data/README.md` for the licence and the attribution it asks for.
[tool.setuptools.package-data]
b3 = ["data/*.mmdb", "data/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Declared, not inherited: with no `select`, ruff enforces its own defaults, which are a property of
# the installed version rather than of this project. Pycodestyle's real errors plus pyflakes.
# Widening the set is a deliberate change with a diff attached.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
# `mypy --strict src` passes. Install the dev extra first — the stubs above are part of the check,
# not optional extras: without them yaml and paramiko come back untyped.

# The legacy importer is exempt, and this is the one place worth being explicit about why. It reads
# rows out of *somebody else's* fifteen-year-old database, whose columns differ between B3 versions
# and MySQL/SQLite dumps: every value arrives as `Any` and the module's whole job is to coerce it.
# Annotating that faithfully would mean asserting a shape the data does not actually promise, which
# is worse than saying so here. It is also run once, by hand, with `b3 import-db`.
[[tool.mypy.overrides]]
module = "b3.legacy.importer"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# An optional extra, so the type checker will not always have it installed. Imported inside a
# function with ImportError handled, which is the shape this silences rather than papers over.
module = "argcomplete.*"
ignore_missing_imports = true
