# censor — bad language in chat and in player names.
settings:
  max_level: 40      # players above this level are never checked
  ignore_length: 3   # text this short is skipped entirely

# Used by any entry that does not name its own penalty.
default_penalty:
  penalty: warning   # warning | kick | tempban | ban
  reason: "^7watch your language"
  duration: 1h       # how long a `warning` lives, or a `tempban` lasts

# `word` matches on word boundaries (so "ass" does not fire on "class");
# `regexp` is used as-is. Either may carry its own penalty/reason/duration.
badwords:
  - word: ass
  - name: shit
    regexp: '[s$]h[i!1*]+t\b'
  - name: fuck
    regexp: 'f[uo0*]+ck'
    penalty: tempban
    duration: 2h
    reason: "^7that language is not welcome here"

# Names are matched anywhere in the nick — "xXcheaterXx" has no word boundaries.
badnames:
  - word: cheater
    penalty: kick
    reason: "^7pick a different name"

# --- muting instead of warning (Urban Terror) -------------------------------------------------------
#
# This was a separate plugin in the classic bot (`censorurt`, a subclass of `censor`). What it did is
# all here: silence the offender for an escalating number of minutes using the game's own `mute` verb,
# optionally slap them as well, and fall through to the word's own penalty once they have been muted
# often enough.
#
# It needs the engine to have a `mute` verb, which today means the Urban Terror family. On any other
# title this section is refused at startup with a reason in the log and the ordinary penalties apply —
# nothing silently does nothing.
#
# Leave the section out (or `mute_minutes` empty) and censor behaves exactly as it does without it.

# mute:
#   # Minutes of silence for the first offence, the second, and every one after that. Two entries or
#   # five work as well as three; the last one repeats.
#   mute_minutes: [1, 5, 30]
#
#   # Slap them as well, where the engine has a verb for it. The classic did this on every censor hit,
#   # whether or not muting was on.
#   slap: no
#
#   # After this many muted offences the word's own penalty applies *as well*, so somebody who will not
#   # stop still gets kicked or banned. 0 mutes forever.
#   warn_after: 3
#
# Two more messages, rewordable in the main config's `messages:` block:
#
#   censor_muted     said to the server ({name}, {minutes})
#   censor_unmuted   said privately when the mute runs out
