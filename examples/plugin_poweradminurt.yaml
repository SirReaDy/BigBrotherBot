# poweradminurt — Urban Terror's own admin commands, and the balancers behind them.
#
# Point at it from the main config:
#
#   plugins:
#     - name: poweradminurt
#       config: "@conf/plugin_poweradminurt.yaml"
#
# The classic plugin is 3,846 lines and forty-nine commands. What is here so far:
#
# Player control:
#
#   !paslap <player> [times]   throw them about, up to 25 times, one a second (alias: !slap)
#   !panuke <player> [times]   nuke them (alias: !nuke)
#   !pakill <player>           kill them where they stand
#   !pamute <player> [minutes] stop them talking (alias: !mute)
#   !paunmute <player>         let them talk again
#
# Moving players between teams:
#
#   !paforce <player> <red|blue|spec|free> [lock]   move them; `lock` puts them back if they switch,
#                                                   and `free` releases the lock (alias: !force)
#   !paswap <player> [player]     two players change places; one name swaps them with you (alias: !swap)
#   !paswapteams                  swap the two teams around (alias: !swapteams)
#   !pashuffleteams               shuffle everybody (alias: !shuffleteams)
#   !pateams                      even the teams up now, by numbers (alias: !teams)
#   !pabalance                    even them up by skill, moving as few players as possible (!bal)
#   !paskuffle                    shuffle everybody into teams matched by skill (alias: !sk)
#   !paunskuffle                  deliberately make them unfair, to watch the balancer work (!unsk)
#   !paadvise                     say which side is winning, and how badly (alias: !advise)
#   !paautoskuffle [mode]         what to do about uneven skill automatically (alias: !ask)
#
# The match settings — each one writes a single cvar:
#
#   gametypes   !paffa !palms !patdm !pats !paftl !pacah !pactf !pabomb !pajump !pafreeze !pagungame
#   toggles     !painstagib !pahardcore !pafunstuff !paskins !pawaverespawns  (on|off)
#   numbers     !pacaplimit !patimelimit !pafraglimit !pasetgravity !parespawndelay !parespawngod
#               !pahotpotato !pabluewave !paredwave   (each bounded — the classic passed the text
#               straight through, so `!pasetgravity banana` set the gravity to `banana`)
#   the rest    !pastamina default|regain|infinite, !pamoon on|off, !pagear, !pasetnextmap <map>
#
# `!pagear` takes `all`, `none`, `reset`, or `+weapon`/`-weapon` from: nade, snipe, spas, pistol, auto,
# negev. With no argument it says which are allowed — the classic sent that answer to the *server* as
# an rcon command, so the admin saw nothing at all.
#
# The server commands:
#
#   !pabigtext <text>  announce something in the biggest text the game has
#   !paset <cvar> <value> / !paget <cvar>    change a server setting, or read one
#   !pavote on|off     let players call votes, or stop them
#   !pamaprestart      restart the map now (alias: !maprestart)
#   !pamapreload       reload it — which is what applies a changed password (alias: !mapreload)
#   !pacyclemap        move on to the next map (alias: !cyclemap)
#   !paexec <file>     run a config file. Level 80, above the other server commands, because what a
#                      config file contains is anything; the name must look like a filename
#   !papublic on|off   open the server to everybody, or put a password on it (alias: !public)
#   !pamatch on|off    put the server into match mode, and the plugins with it (alias: !match)
#
# Two commands from the classic are deliberately absent. `!paveto` is `callvote`'s `!veto`, which works
# on every engine that can cancel a vote rather than only this one. `!paversion` printed the plugin's
# version; `!plugin info` answers that for every plugin.
#
# The four player commands need the engine to have the verb (`slap`, `nuke`, `smite`, `mute` — the
# Urban Terror family has all four). On a title that has none they are still registered and answer that
# the game has no such command, which is how an operator finds out.

settings:
  # Level for the commands that act on a player — the four penalties, `!paforce` and `!paswap`.
  player_command_level: 40

  # Level for the ones that change a server setting — `!paset`, `!paget`, `!pavote`, `!pabigtext` and
  # every match setting, plus `!paswapteams` and `!pashuffleteams`, which move everybody at once.
  # Higher on purpose: `!paset` can change anything at all.
  server_command_level: 60

  # Nobody may slap, nuke, kill or mute a player at or above their own level — you can always do it to
  # yourself. The classic had three different rules across three commands and *no* rule on `!panuke`,
  # so which of your fellow admins you could throw about depended on which verb you reached for.
  protect_peers: yes

  # `!papublic off` puts a password on the server, built from this word plus a few digits so that it
  # changes each time. Without a word here the command refuses — where the classic set a password made
  # only of digits and told the admin that was the password. The password is sent privately to whoever
  # typed the command and is deliberately *not* written to the log.
  private_password: ""
  password_digits: 2

  # Minutes `!pamute` uses when the admin does not say. Always a real duration: the classic sent the
  # mute verb with an empty one, which toggles on these builds, so a mute could outlive the bot that
  # set it with nothing recording that it was on.
  default_mute_minutes: 5

  # -- the team balancer ---------------------------------------------------------------------
  #
  # It keeps the two sides the same size, moving whoever joined theirs most recently. Unlike the
  # classic it works the whole move out in one pass: that one moved a player, asked the server to
  # count the teams again, and believed an answer that could not yet include the move it had just
  # made — so it kept picking the same player, up to twenty-five times.

  # Minutes between automatic checks. 0 turns the balancer off entirely, which is the classic's own
  # switch, and leaves `!pateams` working for an admin who wants to ask.
  teambalance_interval: 30

  # How many players one side may have more than the other before anybody is moved. One is usually
  # right: on an odd number of players the teams cannot be equal.
  teambalance_difference: 1

  # Nobody at or above this level is moved, so an admin can go and prop up the weaker team without
  # being sent straight back.
  teambalance_max_level: 60

  # How a balance is announced: `bigtext` across the screen, `say` in the chat, or `off`. The classic
  # wrote 2, 1 and 0 for these. Nothing is announced unless somebody actually moves — the classic said
  # it the moment it found the teams uneven and only then went looking, so a server whose bigger team
  # was all admins was told it was being balanced every interval, forever.
  teambalance_announce: bigtext

  # Which gametypes to balance, by name. The classic's `bm` (bomb mode) and `dm` (free-for-all)
  # spellings are understood, so a config carried across from it still means what it said.
  # Names: ffa lms tdm ts ftl cah ctf bomb jump freeze gungame
  teambalance_gametypes: tdm, ctf, cah, ftl

  # Which of those are played in rounds. Moving somebody mid-round takes them out of a round they are
  # in the middle of, so a balance that falls due during one waits for the end of it. A setting rather
  # than the classic's hard-coded pair, because a server's config can make a gametype round-based.
  teambalance_round_based: ts, bomb

  # Whether a player who unbalances the teams by switching is put straight back. Only if it was *their*
  # switch that did it: the classic asked "are the teams uneven?" instead, so with red on five and blue
  # on two, joining blue — helping — got you forced to "the smaller team", which is the one you had
  # just joined, plus two fabricated suicides deducted from your stats. There is no penalty here.
  teambalance_on_team_change: yes

  # Seconds of quiet after anything moves players on purpose — a shuffle, a swap, a `!paforce`, a round
  # start, or the bot starting up and adopting a server full of players. The classic's `ignoreSet`, and
  # what stops the balancer spending its next pass undoing a `!pashuffleteams`.
  teambalance_quiet_seconds: 60

  # Whether `!paforce <player> <team> lock` survives a map change. Off, as the classic had it: a lock is
  # usually meant for the rest of this map.
  team_locks_permanent: no

  # Level for `!pateams`. The classic let a regular ask, and asking only ever evens the teams up.
  teams_command_level: 2

  # -- the skill balancer --------------------------------------------------------------------
  #
  # The same idea about a different quantity: two sides of four are even in numbers and not in
  # anything else. Each player gets a score out of what they have done *since they joined the team
  # they are on* — kill ratio, net contribution per minute, headshot ratio, and what they did for the
  # mission — and a shuffle deals everybody out a hundred times and keeps the evenest arrangement.
  #
  #   !paskuffle      shuffle everybody into teams matched by skill (alias: !sk)
  #   !pabalance      the same result, moving as few players as possible (alias: !bal)
  #   !paunskuffle    deliberately put the best players together, to watch the other two work
  #                   (alias: !unsk)
  #   !paadvise       say which side is winning, and whether it is worth acting on (alias: !advise)
  #   !paautoskuffle  read or set the mode below (alias: !ask)
  #
  # What happens automatically when the sides are uneven in skill:
  #
  #   off       nothing; the commands above still work
  #   advise    say so in the chat
  #   balance   move as few players as possible — the recommended setting, and the classic's too
  #   shuffle   deal everybody out again
  #
  # The classic wrote 0, 1, 2 and 3 for these, and those are still accepted.
  skillbalance_mode: "off"

  # Minutes between automatic skill checks. 0 leaves the commands working and nothing automatic.
  skillbalance_interval: 0

  # How lopsided the game has to feel before the mode above acts. This is measured from the kill rate
  # of each side's best players over the last few minutes, which is what a game feels like from
  # inside it — an average over everybody hides the two players who are deciding it.
  #
  # Note that the same setting in the classic meant roughly double this, because it divided every
  # score by the weight of measures it had skipped as well as the ones that counted.
  skillbalance_difference: 0.5

  # Below this many players the figures are noise: nothing is said and nothing is done. `!paadvise`
  # says it cannot tell rather than reporting a difference of 0.00 on an empty server.
  skillbalance_min_players: 3

  # Minutes a player below moderator must wait between asking for another shuffle. The classic put
  # this behind an `and` of three conditions, so the wait it advertised almost never applied.
  skillbalance_min_interval: 2

  # The most of the server `!pabalance` will move, as a fraction of the players. If it cannot find an
  # improvement within that, it falls back to a full shuffle — rare in practice.
  skuffle_max_move_fraction: 0.3

  # Where the score cannot be improved any further, the shuffle distributes the snipers instead: an
  # SR8 or PSG-1 kills in one shot, and all of them on one side decides the game. A player carrying
  # one with a worse kill ratio than this is carrying a rifle rather than using one, and is ignored.
  sniper_kill_ratio: 1.2

  # -- the spectator check -------------------------------------------------------------------
  #
  # Once the server is busy, somebody sitting in the spectators is holding a slot another player
  # wants. This asks them to play or leave — by warning them; `admin`'s own escalation is what
  # eventually removes them, so how many warnings that takes is your warn policy, not this setting.

  # Minutes between checks; 0 turns it off. A player is removed after roughly
  # `speccheck_max_spec_minutes` plus this interval times the warnings your admin config allows.
  speccheck_interval: 0

  # Minutes a player may watch rather than play once the server counts as busy.
  speccheck_max_spec_minutes: 5

  # How many connected clients make it busy. 0 works it out from the server's own slots minus the
  # reserved ones — sixteen slots with four private means twelve. The classic worked that out once
  # when the config loaded, so a server whose reserved slots changed used the old number until it
  # was restarted; here it is read when the check runs.
  speccheck_min_players: 0

  # Nobody at or above this level is asked to play or leave. The classic's default was 0, and the
  # rule is "at or above is exempt" — so a server that set the interval and left the rest of this
  # section alone ran the check, skipped every player on it, and said nothing at all.
  speccheck_max_level: 20

  # How long each of those warnings lives.
  speccheck_warn_minutes: 5

  # Nothing happens at all while `g_maxGameClients` is set, because that means the *server* is
  # deciding who plays and putting the surplus in the spectators. Warning them for it would be the
  # bot punishing players for something the server did to them. Bots are counted towards "busy" —
  # a bot fills a slot — and never warned, since a warning is a thing you say to a person.

  # -- the name checker ----------------------------------------------------------------------
  #
  # Three rules about names, and none of them overlap `nickreg`: that plugin answers "is this a name
  # registered to somebody else?", and these answer "is this a name at all?".
  #
  # Names are compared the way players see them — colour codes stripped, trimmed, lower-cased. The
  # classic compared the raw strings, so `^1Bob` and `^2Bob`, identical on the scoreboard, were not
  # duplicates of each other; and its check for the default nickname called its colour-stripper on
  # its own constant rather than on the player's name, so `^1New UrT Player` walked straight past.

  # Minutes between sweeps for duplicate and forbidden names; 0 turns them off.
  namecheck_interval: 0

  # Whether two players wearing one name are both warned for it. Both, because which of them took it
  # from the other is not knowable from here.
  namecheck_duplicates: yes

  # Names nobody may wear, comma-separated. `New UrT Player` is the default nickname — somebody who
  # never set one — and `all` is the word admin commands use to mean everybody, so a player wearing
  # it makes those commands ambiguous. The classic had a setting called `checkbadnames` that turned
  # on exactly one hard-coded word.
  namecheck_forbidden_names: New UrT Player, all

  # How many times a player may change name during one map before being removed; 0 allows any number.
  # Somebody who renames every thirty seconds cannot be talked about, complained about or reported,
  # which is the whole reason for the limit. They are told how many they have left as they approach
  # it. A reconnecting player whose name is taken comes back as `Bob_3` — that is the engine renaming
  # them rather than them renaming themselves, and it does not count.
  namecheck_max_changes: 7

  # Nobody at or above this level is checked at all. The classic hard-coded 9 for the rename limit,
  # which is not a level any group has, and checked nothing for the other two rules.
  namecheck_max_level: 20

  # Bots are never warned: they cannot read one, and several bots on one server routinely wear a
  # single name — the classic warned every one of them, on every sweep.

  # -- bot support ---------------------------------------------------------------------------
  #
  # Keeps the server populated with AI players on maps an operator has said are safe. The classic's
  # own configuration file put it like this, in capitals: "BOTSUPPORT IS VERY UNSTABLE! IT MAY CRASH
  # YOUR SERVER PLENTY!" — and answered itself with a list of maps bots had been seen to survive.
  # That list is the feature, so an empty one means no map rather than every map.
  #
  # While this is off, nothing here writes a bot cvar at all. The classic rewrote `g_spskill` on
  # every config load whether or not it was running bots, and only ever wrote `bot_enable 1` — so
  # switching the feature off and reloading left the engine's bot subsystem on with the count at
  # zero, and a server whose operator manages bots by hand had its settings changed underneath them.
  botsupport_enable: no

  # How good they are, 1-5.
  botsupport_skill: 4

  # How many clients the server tops itself up to.
  botsupport_min_players: 4

  # The maps they are allowed on, and nowhere else. These five are the classic's own shipped list —
  # the maps its authors had seen bots survive on — and they are Urban Terror 4.1-era, so treat them
  # as a starting point and not as a promise:
  #
  #   ut4_abbey, ut4_algiers, ut4_austria, ut4_riyadh, ut4_uptown
  #
  # Compared case-insensitively; the classic compared exactly, so `ut4_Abbey` in the config silently
  # matched nothing. A map outside the list turns the bots off rather than leaving them running.
  botsupport_maps: ""

  # -- the headshot counter ------------------------------------------------------------------
  #
  # Announces how many headshots a player has landed, and tells newcomers what the helmet and the
  # kevlar are for. Needs an engine that reports *where* a shot landed, which in this family means
  # Urban Terror; switching it on also sets `g_loghits 1`, without which the server logs no hits at
  # all and the counter would count nothing while saying nothing about why.
  headshot_counter: no

  # When the counts start again: `no`, `map` or `round`.
  headshot_reset: map

  # How an announcement is made: `bigtext` across the screen, `say` in the chat, or `off` to keep
  # counting quietly. The classic had a `broadcast` boolean whose True branch — its default — handed
  # the announcement to rcon as though a line of prose were a command, so on the setting most
  # operators were running, every headshot announcement went to the server and nowhere else.
  headshot_announce: bigtext

  # Announce every headshot, rather than only counting them.
  headshot_announce_all: yes

  # Add the shooter's headshot percentage, once they have more than five and it beats the floor.
  headshot_percentages: yes
  headshot_percent_min: 10

  # Tell a victim what a helmet is for, after this many hits to the head.
  headshot_warn_helmet: yes
  headshot_warn_helmet_after: 7

  # And what kevlar is for, after this many to the torso.
  headshot_warn_kevlar: yes
  headshot_warn_kevlar_after: 50

  # Only players with fewer connections than this are advised: somebody on their two hundredth visit
  # knows about the helmet. The classic's own rule, and its number.
  headshot_advice_connections: 20

  # -- the rotation manager ------------------------------------------------------------------
  #
  # Switches the server's map list by how busy it is: small maps for a handful of players, big ones
  # for a full server. Counts the players who will be *on* the map — not the spectators, and not the
  # bots the section above may have added to fill the server up.
  rotation_manager: no

  # Up to this many players is a small map; up to the second, a medium one; above it, large.
  rotation_small_max: 4
  rotation_medium_max: 12

  # How far past a switch point the count has to go before the list actually changes, so a server
  # hovering on one does not change its maps every time somebody joins. The classic expressed this
  # as "was the last thing a join or a part?" and had the join case backwards: with the switch at 4
  # and a margin of 2, five players who had just been joined got the *small* rotation, while the
  # same five after somebody left got the medium one — joining a player could shrink the maps.
  rotation_hysteresis: 2

  # The three map-cycle files, as `g_mapcycle` wants them: a filename the server can find, which in
  # practice means one sitting beside `mapcycle.txt` in the game directory. All three must be named
  # or nothing happens at all — a band with no list would switch the server to an empty map cycle.
  #
  # The classic had a fourth setting here, `gamepath`, which it checked for and then never used:
  # the filename went to the cvar on its own. It is not a setting here.
  rotation_small: ""
  rotation_medium: ""
  rotation_large: ""

  # -- match mode ------------------------------------------------------------------------------
  #
  # `!pamatch on` (alias `!match`) tells the engine a match is being played, switches off the plugins
  # named here, and runs a config file; `off` puts it all back. Everything automatic in this plugin —
  # both balancers, the spectator and name checks, the headshot counter, the bots — stands down while
  # a match is on: those policies exist to keep a *public* server pleasant, and the people in a match
  # have agreed the teams between themselves.

  # Plugins to switch off for the duration, comma-separated. Only the ones that were actually running
  # are switched back on afterwards; the classic re-enabled everything on its list, so a plugin an
  # operator had deliberately turned off came back on because a match had happened.
  matchmode_plugins: ""

  # Config files run when a match starts and when it ends. Named, not paths: the file has to be one
  # the *server* can find, and the classic checked for it on the bot's own disk before sending the
  # command — so with the bot on another machine, which this project supports, a perfectly good
  # config was skipped without a word.
  matchmode_on_config: ""
  matchmode_off_config: ""

  # A config file per gametype, run when the gametype command for it is used. A match on capture the
  # flag can want a different time limit from one on team deathmatch, and an operator who has written
  # that down should not have to type it as well. Names: ffa lms tdm ts ftl cah ctf bomb jump freeze
  # gungame.
  matchmode_configs: {}
  #  ctf: config_ctf.cfg
  #  ts:  config_ts.cfg

  # -- the vote delay --------------------------------------------------------------------------
  #
  # Minutes at the start of a round during which nobody may call a vote; 0 turns it off. A vote called
  # in the first thirty seconds is one called before anybody has seen the map, and it decides the next
  # twenty minutes for everybody.
  #
  # Voting is put back to whatever it was, and a server whose operator keeps voting off is not handed
  # voting a minute later. A round starting inside a running delay restarts it — the classic started a
  # thread per round and cancelled none of them, so the first would hand voting back in the middle of
  # the second round.
  vote_delay_minutes: 0

# Everything it says can be reworded in the main config's `messages:` block:
#
#   pa_slapped / pa_nuked / pa_killed / pa_muted / pa_unmuted     ({name}, {minutes})
#   pa_protected          the target outranks you ({name})
#   pa_repeat_range       a bad repeat count ({limit})
#   pa_unavailable        this game has no such verb ({verb})
#   pa_cvar / pa_cvar_unset / pa_cvar_changed                     ({name}, {value})
#   pa_vote_on / pa_vote_off / pa_vote_usage
#   pa_usage_player / pa_usage_set / pa_usage_get / pa_usage_bigtext
#   pa_teams_balancing / pa_teams_already / pa_teams_balanced / pa_teams_stuck / pa_teams_pending
#   pa_teams_moved_you / pa_teams_put_back                        ({team})
#   pa_skill_shuffling / pa_skill_balancing / pa_skill_unshuffling
#   pa_skill_was_now ({was}, {now}) / pa_skill_no_improvement / pa_skill_figures ({felt}, {skill})
#   pa_skill_fair / pa_skill_now / pa_skill_remains / pa_skill_stronger / pa_skill_weaker
#                                                                 ({team}, {word})
#   pa_skill_use_bal / pa_skill_no_action / pa_skill_too_soon / pa_skill_too_few
#   pa_skill_moved / pa_skill_moved_best                          ({team}, {other})
#   pa_skill_mode / pa_skill_mode_set / pa_skill_mode_usage       ({mode}, {options})
#   pa_spec_reason        why a spectator on a full server was warned
#   pa_name_duplicate / pa_name_forbidden / pa_name_changes_kick
#   pa_name_changes_left                                          ({count})
#   pa_headshot_one / pa_headshots / pa_headshots_percent          ({name}, {count}, {percent})
#   pa_advice_helmet / pa_advice_kevlar                            ({count})
#   pa_match_usage / pa_match_on / pa_match_off / pa_match_reload
#   pa_match_plugins_off / pa_match_plugins_on                     ({plugins})
